version: 2

sources:
  - name: atmosync_raw
    database: ATMOSYNC
    schema: RAW

    tables:
      - name: raw_events
        identifier: RAW_EVENTS
        description: "Raw IoT telemetry events ingested from Kafka."

        config:
          loaded_at_field: INGESTED_AT
          freshness:
            warn_after:
              count: 1
              period: hour
            error_after:
              count: 24
              period: hour

      - name: raw_commodity_prices
        identifier: RAW_COMMODITY_PRICES
        description: "Raw commodity pricing data generated by the simulator."

        config:
          loaded_at_field: INGESTED_AT
          freshness:
            warn_after:
              count: 1
              period: hour
            error_after:
              count: 24
              period: hour
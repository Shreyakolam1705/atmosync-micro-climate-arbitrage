
# AtmoSync dbt project configuration

name: 'atmosync_dbt'
version: '1.0.0'
config-version: 2

# Snowflake dbt profile
profile: 'atmosync_dbt'

# Project directories
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Files and folders removed by dbt clean
clean-targets:
  - "target"
  - "dbt_packages"

# Model configurations
models: {}
